# One-off cleanup: shut down services that are no longer used.
#
# Usage:
#   ansible-playbook -i inventory/inventory.ini playbooks/decommission_unused.yml --limit pi
#
# Notes:
# - Data directories/volumes are intentionally left on disk (not deleted).
# - hur-control-app is deployed by a separate ansible/CI pipeline (its quadlet
#   file says so). This playbook only stops it here; that other pipeline needs
#   to stop deploying it or it will come back on its next run.

- name: Decommission unused services on Pi
  hosts: pi
  become: yes
  tasks:
    - name: Stop and disable Vikunja quadlet service
      ansible.builtin.systemd:
        name: vikunja.service
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove Vikunja quadlet unit file
      ansible.builtin.file:
        path: /etc/containers/systemd/vikunja.container
        state: absent
      notify: Reload systemd

    - name: Remove Shiori container
      containers.podman.podman_container:
        name: shiori-app
        state: absent

    - name: Remove WithoutBG container
      containers.podman.podman_container:
        name: withoutbg-app
        state: absent

    - name: Remove obsidian-livesync (couchdb) container
      containers.podman.podman_container:
        name: obsidian-livesync
        state: absent

    - name: Stop and disable hur-control-app quadlet service
      ansible.builtin.systemd:
        name: hur-control-app.service
        state: stopped
        enabled: false
      failed_when: false

    # junttila.dev / freelance.junttila.dev moved to the VPS (deploy_loadbalanced.yml)
    - name: Stop and disable junttila-dev-freelance quadlet service
      ansible.builtin.systemd:
        name: junttila-dev-freelance.service
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove junttila-dev-freelance quadlet unit file
      ansible.builtin.file:
        path: /etc/containers/systemd/junttila-dev-freelance.container
        state: absent
      notify: Reload systemd

    # WooCommerce stack (podman-compose project in /opt/woocommerce) taken down
    # 2026-10-22 after the PHP2Shell RCE (CVE-2026-109618/109619); the
    # wordpress:latest image was PHP 8.3.31 (vulnerable). The role is commented
    # out in pi.yml and the Caddy site in inventory/group_vars/vps.yml.
    # Volumes woocommerce_db_data / woocommerce_wp_data and /opt/woocommerce
    # are kept on purpose (data + forensic evidence).
    - name: Remove WooCommerce containers (volumes are kept)
      containers.podman.podman_container:
        name: "{{ item }}"
        state: absent
      loop:
        - woocommerce_wordpress_1
        - woocommerce_db_1
      tags: woocommerce

    - name: Remove WooCommerce pod
      containers.podman.podman_pod:
        name: pod_woocommerce
        state: absent
      tags: woocommerce

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
