---
- name: Wait for apt lock to be released
  shell: while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 5; done
  changed_when: false

- name: Wait for automatic updates to finish
  shell: while pgrep -x apt-get >/dev/null || pgrep -x dpkg >/dev/null; do sleep 5; done
  changed_when: false

- name: Install dependencies
  apt:
    name:
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
      - curl
    state: present
    update_cache: yes
  retries: 3
  delay: 10

- name: Add Caddy GPG key
  shell: |
    curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  args:
    creates: /usr/share/keyrings/caddy-stable-archive-keyring.gpg

- name: Add Caddy repository
  shell: |
    curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list
  args:
    creates: /etc/apt/sources.list.d/caddy-stable.list

- name: Install Caddy
  apt:
    name: caddy
    state: present
    update_cache: yes

- name: Debug caddy_sites variable
  debug:
    var: caddy_sites

- name: Ensure sites.d directory for drop-in site files exists
  file:
    path: /etc/caddy/sites.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Ensure access log directory exists
  file:
    path: "{{ caddy_access_log_dir }}"
    state: directory
    owner: caddy
    group: caddy
    mode: '0755'
  when: caddy_access_log

# Pre-create the file as the caddy user. If it is first created by something
# running as root (e.g. `sudo caddy validate`), caddy cannot open it and the
# reload hangs.
- name: Ensure access log file is owned by caddy
  file:
    path: "{{ caddy_access_log_path }}"
    state: touch
    owner: caddy
    group: caddy
    mode: '0640'
    modification_time: preserve
    access_time: preserve
  when: caddy_access_log

- name: Configure Caddyfile
  template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: '0644'
  notify: Reload Caddy

- name: Ensure Caddy is enabled and running
  systemd:
    name: caddy
    state: started
    enabled: yes
